name: CD

# Runs only after CI succeeded on a push to main (never for PRs or forks).
#   publish -> staging (automatic) -> promote (opens a PR; a human reviews + merges it)
#
# This workflow NEVER deploys to production. It only opens or updates a pull request that
# edits `image_tag` in deploy/production.yml. Merging that PR (after review) triggers
# deploy-production.yml, which verifies the approval and then deploys.
#
# ROLLBACK: Actions -> CD -> Run workflow -> image_tag = an older `sha-xxxxxxx`.
# That skips build and staging and opens a rollback PR through the same review path.
# The image must still exist in GHCR.
#
# REQUIRED REPO SETTING: Settings -> Actions -> General -> Workflow permissions ->
# enable "Allow GitHub Actions to create and approve pull requests".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Rollback: existing image tag to deploy to production (e.g. sha-1a2b3c4)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish image to GHCR
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      # Safe to check out head_sha: the job `if` above only admits a successful *push* run whose
      # head repository is this repo (never a fork), so this is trusted, already-merged code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}   # exactly the commit CI validated
      - name: Compute tag and image name
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"   # GHCR requires lowercase
          {
            echo "tag=sha-${GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA:0:7}"
            echo "image=ghcr.io/${repo}"
          } >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64   # Render only runs linux/amd64 images
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    name: Staging
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-render.yml
    with:
      environment: staging
      image_tag: ${{ needs.publish.outputs.tag }}
    secrets: inherit

  promote:
    name: Open production promotion PR
    needs: [publish, staging]
    # Normal path: staging succeeded. Rollback path: manual dispatch (publish/staging are skipped).
    if: >-
      always() && !cancelled() &&
      (needs.staging.result == 'success' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # push the promotion branch
      pull-requests: write   # open / update the PR
    concurrency:
      group: promote-production
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.image_tag || needs.publish.outputs.tag }}
      EVENT: ${{ github.event_name }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Open or update the PR
        run: |
          set -euo pipefail
          case "$TAG" in
            sha-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "::error::image_tag must look like sha-1a2b3c4 (got '$TAG')"; exit 1 ;;
          esac

          pin() { sed -n -E 's/^image_tag:[[:space:]]*"?([^"[:space:]#]+)"?.*/\1/p' | head -1; }
          current=$(pin < deploy/production.yml)
          if [ "$current" = "$TAG" ]; then
            echo "::notice title=Already pinned::main already pins ${TAG}; nothing to promote."
            exit 0
          fi

          if [ "$EVENT" = workflow_dispatch ]; then
            kind="Rollback"; branch="rollback/production-${TAG}"
          else
            kind="Promote"; branch="promote/production"   # one rolling PR: newer builds update it
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch" origin/main
          # Replace only the tag value, so line endings and comments stay untouched.
          sed -i -E "s/^(image_tag:[[:space:]]*)[^[:space:]#]+/\1${TAG}/" deploy/production.yml
          git commit -am "${kind} production to ${TAG}"
          git push --force origin "$branch"

          title="${kind} production to ${TAG}"
          body="$(printf '%s\n' \
            "**Image tag:** \`${TAG}\` (was \`${current}\`)" \
            "**Source commit:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SOURCE_SHA}" \
            "**Triggered by:** ${EVENT} · [run #${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" \
            "" \
            "Staging deployed this build successfully (rollbacks reuse an existing image)." \
            "**Approve and merge this PR to deploy to production.** Nothing deploys until it is merged.")"

          existing=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            echo "Updated PR #${existing}"
          else
            gh pr create --base main --head "$branch" --title "$title" --body "$body"
          fi
