# Keeps dependencies and CI actions current via small weekly PRs. Security updates are
# separate (enable "Dependabot security updates" in repo settings) and arrive immediately.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      python-dev-tools:
        patterns: [ruff, pytest*]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
