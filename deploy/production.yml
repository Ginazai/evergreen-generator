# Desired state of PRODUCTION: the one line below is the image tag production runs.
#
# Do not edit on main. Changes arrive as a "promotion" pull request that cd.yml opens after
# a build passes CI and staging. Merging that PR (after review) is what deploys, via
# .github/workflows/deploy-production.yml, which refuses to deploy a change that did not
# come from a merged PR with an approving review.
#
# `none` = nothing promoted yet; the first merged promotion PR replaces it.
image_tag: none
