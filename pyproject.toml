[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evergreen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "typer==0.27.3",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "google-genai==2.31.0",
]

[project.optional-dependencies]
piper = ["piper-tts==1.8.0"]
gui = ["streamlit>=1.66,<2"]  # 1.66: badges en etiquetas y contenedores horizontales
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.1"]

[project.scripts]
evergreen = "evergreen.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.coverage.report]
# Se aplica con --cov; una ejecución parcial sin --cov no se ve afectada.
fail_under = 85
show_missing = true
